name: Saved-output reproducibility
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install minimal analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify preserved public inputs
        run: python scripts/verify_integrity.py
      - name: Reanalyse public saved outputs
        run: python scripts/reproduce.py --output /tmp/akc-public-reanalysis.json
      - name: Test policy and metrics
        run: python -m unittest discover -s tests -v
      - name: Regenerate companion figures
        run: python scripts/create_figures.py
